# Test-gated auto-deploy.
#
# On every push to main: run the engine/server tests and a production build,
# and ONLY if both pass, trigger the Render (server) and Netlify (client)
# deploys via their deploy hooks. This is stricter than the hosts' built-in
# auto-deploy, which would ship even when tests are red.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_URL   — Render: service → Settings → Deploy Hook
#   NETLIFY_BUILD_HOOK_URL   — Netlify: Site config → Build & deploy → Build hooks
#
# Because this workflow drives the deploys, turn OFF Render's own auto-deploy so
# you don't get double builds — render.yaml already sets autoDeploy: false.
#
# Do NOT do the same on Netlify with "stop auto publishing". That is Netlify's
# "locked deploys": it still builds, it just never publishes, so it prevents no
# work and guarantees the live site never changes. This file used to tell you to
# turn it on, and on 2026-11-24 both deploy steps below reported success while
# the client sat on the previous bundle for two days.
#
# Netlify needs auto publishing ON and builds ACTIVE for the hook to reach the
# live site; stopping builds disables build hooks too. There is no documented way
# to build on a hook but not on a push, so a Git-linked site will build twice.
# See DEPLOY.md — "Verifying a deploy actually shipped" — before trusting a green
# check here: these steps go green on a 200 from the hook, which only means the
# host accepted the request.

name: deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build (client)
        run: npm run build

      - name: Trigger Render deploy (server)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Netlify deploy (client)
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl -fsSL -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"
